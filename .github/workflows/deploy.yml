name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Um deploy por vez; um push novo espera o anterior terminar
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  deploy:
    needs: verificar
    runs-on: ubuntu-latest
    # Host e usuário podem ser segredos ou variáveis do repositório; a chave, só segredo
    env:
      EC2_HOST: ${{ secrets.EC2_HOST || vars.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER || vars.EC2_USER }}
    steps:
      - name: Conferir os segredos
        env:
          EC2_PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
        run: |
          faltando=""
          [ -n "$EC2_HOST" ] || faltando="$faltando EC2_HOST"
          [ -n "$EC2_USER" ] || faltando="$faltando EC2_USER"
          [ -n "$EC2_PRIVATE_KEY" ] || faltando="$faltando EC2_PRIVATE_KEY"
          if [ -n "$faltando" ]; then
            echo "::error::Segredos vazios:$faltando. Crie em Settings → Secrets and variables → Actions → aba Secrets → Repository secrets."
            exit 1
          fi
          case "$EC2_PRIVATE_KEY" in
            *"-----BEGIN"*) ;;
            *) echo "::error::EC2_PRIVATE_KEY precisa ser o conteúdo inteiro do .pem, com as linhas BEGIN e END."; exit 1 ;;
          esac

      - name: Configurar SSH
        env:
          EC2_PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Atualizar, gerar o build e reiniciar
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$EC2_USER@$EC2_HOST" 'bash -se' <<'REMOTO'
          set -euo pipefail
          cd /srv/mimos
          git fetch --quiet origin main
          git checkout --quiet -B main origin/main
          npm ci --no-audit --no-fund
          npm run build
          sudo systemctl restart mimos
          # A loja precisa responder em até 60 s
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/; then
              echo "Loja no ar: $(git log -1 --format='%h %s')"
              exit 0
            fi
            sleep 2
          done
          echo "A loja não respondeu depois do restart"
          sudo journalctl -u mimos -n 50 --no-pager
          exit 1
          REMOTO

      - name: Limpar a chave
        if: always()
        run: rm -f ~/.ssh/deploy_key
