# /etc/nginx/sites-available/mimos  (ln -s em sites-enabled)
# O HTTPS é configurado pelo certbot:  sudo certbot --nginx -d seudominio.com.br -d www.seudominio.com.br
server {
    listen 80;
    server_name seudominio.com.br www.seudominio.com.br;

    # Upload de fotos no driver local (sem S3) passa por aqui; o app limita a 8 MB
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Substitui (não acrescenta): o limite de tentativas de login usa este IP,
        # e o cliente não pode forjar o valor
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
